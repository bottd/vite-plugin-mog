[package]
name = "vite-plugin-mog-parser"
version = "0.2.1"
edition = "2024"
authors = ["Drake Bott"]
description = "napi parser for vite-plugin-mog"
license = "MIT"
repository = "https://github.com/bottd/vite-plugin-mog"
publish = false

[lib]
name = "vite_plugin_mog_parser"
crate-type = ["cdylib", "rlib"]
path = "src/parser/lib.rs"


[dependencies]
napi = { version = "=3.13.0", features = ["serde-json"] }
napi-derive = { version = "=3.6.9", features = ["type-def"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
htmlescape = "=0.3.1"
# INTERIM: the unreleased `attr` branch, where attributes replaced the old
# `meta`/`data` KDL blocks. No crates.io release carries that yet. A published
# mog-parser is expected — when it lands, replace this with a version requirement
# and drop the `meta`/`data` deprecation warning in src/parser/render.rs.
#
# Pinned by rev, not `branch = "attr"`, so the parser only moves when this line
# does. Bump this rev deliberately.
mog-parser = { git = "https://github.com/bottd/mog.git", rev = "57b31bfb390982f1b6ec0cb138727b40697c6f31" }
arborium = { version = "=2.18.2", features = ["all-languages"] }

[dev-dependencies]
insta = { version = "=1.48.0", features = ["yaml"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# DEVELOPMENT ONLY — remove before release.
# mog-parser is pinned by git rev above, so there is no way to build against
# unpushed parser work. This points it at the local checkout instead. Once the
# span work is pushed, delete this and bump the rev deliberately.
[patch."https://github.com/bottd/mog.git"]
mog-parser = { path = "../mog/packages/parser" }
